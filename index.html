<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>佳冬解說牌語音導覽系統</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* 強制壓低 A-Frame 場景與 MindAR 內建掃描 UI 的層級 */
    a-scene {
      position: fixed !important;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 1 !important;
    }

    .mindar-ui-overlay {
      z-index: 10 !important;
    }

    /* 授權遮罩 UI */
    #start-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 9999; color: #fff; text-align: center; padding: 20px; box-sizing: border-box;
    }

    #start-btn {
      padding: 14px 28px; font-size: 18px; font-weight: bold;
      background-color: #007bff; color: white; border: none;
      border-radius: 30px; cursor: pointer; margin-top: 15px;
    }

    /* 上方狀態提示列 */
    #status-msg {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75); color: white;
      padding: 10px 20px; border-radius: 20px;
      font-size: 14px; z-index: 9500; text-align: center;
      white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }

    /* 中央文字解說卡片 */
    #info-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -52%);
      width: 86vw;
      max-width: 400px;
      max-height: 60vh;
      background: #ffffff;
      color: #222;
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      z-index: 9000;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #card-body {
      padding: 22px 24px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #card-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: bold;
      color: #007bff;
      background: rgba(0, 123, 255, 0.12);
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    #card-title {
      margin: 0 0 12px 0;
      font-size: 22px;
      font-weight: bold;
      color: #111;
    }

    #card-desc {
      margin: 0;
      font-size: 16px;
      line-height: 1.7;
      color: #444;
      text-align: justify;
    }

    /* 下方懸浮控制按鈕列 */
    #control-bar {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 10px;
      background: rgba(0, 0, 0, 0.85);
      padding: 10px 16px;
      border-radius: 40px;
      z-index: 9500;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    .ctrl-btn {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      color: #fff;
      transition: opacity 0.2s, transform 0.1s;
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    #play-pause-btn { background-color: #28a745; }
    #replay-btn { background-color: #6c757d; }
    #close-btn { background-color: #dc3545; }
  </style>
</head>
<body>

  <!-- AR 場景放在最底層 -->
  <a-scene
    mindar-image="imageTargetSrc: ./jd_demo.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <!-- 預載所有語音檔 (對應不同解說牌) -->
    <a-assets>
      <audio id="audio-0" src="./guide_1.mp3" preload="auto"></audio>
      <audio id="audio-1" src="./guide_2.mp3" preload="auto"></audio>
      <audio id="audio-2" src="./guide_3.mp3" preload="auto"></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ★ 已移除內部的 <a-plane> 彩色半透明遮罩 -->
    <!-- 解說牌 1 (Target Index 0) -->
    <a-entity class="ar-target" data-index="0" mindar-image-target="targetIndex: 0"></a-entity>

    <!-- 解說牌 2 (Target Index 1) -->
    <a-entity class="ar-target" data-index="1" mindar-image-target="targetIndex: 1"></a-entity>

    <!-- 解說牌 3 (Target Index 2) -->
    <a-entity class="ar-target" data-index="2" mindar-image-target="targetIndex: 2"></a-entity>
  </a-scene>

  <!-- 所有 2D UI 統一放在 <a-scene> 之後，確保顯示層級在最上方 -->
  <div id="status-msg">請將鏡頭對準任意景點解說牌...</div>

  <!-- 中央純文字解說卡片 -->
  <div id="info-card">
    <div id="card-body">
      <span id="card-tag">佳冬歷史建築導覽</span>
      <h3 id="card-title">景點名稱</h3>
      <p id="card-desc">景點詳細介紹文字...</p>
    </div>
  </div>

  <!-- 下方懸浮控制列 -->
  <div id="control-bar">
    <button id="play-pause-btn" class="ctrl-btn">⏸ 暫停</button>
    <button id="replay-btn" class="ctrl-btn">🔄 重播</button>
    <button id="close-btn" class="ctrl-btn">✖ 結束</button>
  </div>

  <!-- 授權遮罩 -->
  <div id="start-overlay">
    <h2>佳冬解說牌語音導覽</h2>
    <p>點擊下方按鈕以啟用語音與相機功能</p>
    <button id="start-btn">開始導覽體驗</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 各景點文字解說資料（對應 targetIndex 0, 1, 2）
      const spotData = [
        {
          tag: "縣定古蹟・中西合璧建築",
          title: "蕭屋洋樓",
          desc: "建於日治時期（約1930年代），為佳冬蕭家招待貴賓與休憩之所。建築融合巴洛克式山牆裝飾與傳統閩客工藝，洗石子立面精緻典雅，見證了佳冬蕭家當時的繁華與文化交流。"
        },
        {
          tag: "國定古蹟・五進大院",
          title: "蕭家祖屋",
          desc: "全台罕見的客家五進大院建築群，完整保留了傳統客家宗祠與民居格局。屋脊燕尾與馬背交錯，牆面彩繪與木雕工藝細膩，展現客家族群耕讀傳家與敬祖尊宗的精神。"
        },
        {
          tag: "縣定古蹟・客家堂屋",
          title: "楊家祖堂",
          desc: "佳冬楊氏宗族祭祀祖先的核心場所，建築格局方正莊嚴。正廳神龕與祖牌雕刻精巧，周圍留存傳統太極兩儀池等風水設計，體現六堆客庄傳統聚落的空間美學。"
        }
      ];

      const sceneEl = document.querySelector("a-scene");
      const startOverlay = document.getElementById("start-overlay");
      const startBtn = document.getElementById("start-btn");
      const statusMsg = document.getElementById("status-msg");
      
      // 文字卡片元素
      const infoCard = document.getElementById("info-card");
      const cardTag = document.getElementById("card-tag");
      const cardTitle = document.getElementById("card-title");
      const cardDesc = document.getElementById("card-desc");
      const cardBody = document.getElementById("card-body");

      // 控制列元素
      const controlBar = document.getElementById("control-bar");
      const playPauseBtn = document.getElementById("play-pause-btn");
      const replayBtn = document.getElementById("replay-btn");
      const closeBtn = document.getElementById("close-btn");
      
      // 取得所有語音元素
      const audioList = [
        document.getElementById("audio-0"),
        document.getElementById("audio-1"),
        document.getElementById("audio-2")
      ];

      let arSystem = null;
      let isScanning = true;
      let currentAudio = null;
      let currentTitle = "";

      const getArSystem = () => {
        if (!arSystem && sceneEl.systems) {
          arSystem = sceneEl.systems["mindar-image-system"];
        }
        return arSystem;
      };

      sceneEl.addEventListener("loaded", () => {
        getArSystem();
      });

      // 控制 MindAR 內建掃描框與暗角遮罩的顯示/隱藏
      const toggleMindAROverlay = (show) => {
        const scanningUI = document.querySelector(".mindar-ui-scanning");
        if (scanningUI) {
          scanningUI.style.display = show ? "flex" : "none";
        }
      };

      // 顯示中央文字解說卡片
      const showInfoCard = (index) => {
        const data = spotData[index];
        if (!data) return;

        cardTag.innerText = data.tag;
        cardTitle.innerText = data.title;
        cardDesc.innerText = data.desc;

        cardBody.scrollTop = 0;
        infoCard.style.display = "flex";
      };

      // 隱藏中央文字解說卡片
      const hideInfoCard = () => {
        infoCard.style.display = "none";
      };

      // 停止並重置所有音訊
      const stopAllAudio = () => {
        audioList.forEach(audio => {
          if (audio) {
            audio.pause();
            audio.currentTime = 0;
          }
        });
      };

      // 更新按鈕與狀態列文字
      const updateUIState = (isPlaying) => {
        if (isPlaying) {
          playPauseBtn.innerText = "⏸ 暫停";
          playPauseBtn.style.backgroundColor = "#28a745";
          statusMsg.innerText = `正在播放：${currentTitle}`;
          statusMsg.style.background = "rgba(40, 167, 69, 0.85)";
        } else {
          playPauseBtn.innerText = "▶ 播放";
          playPauseBtn.style.backgroundColor = "#007bff";
          statusMsg.innerText = `已暫停：${currentTitle}`;
          statusMsg.style.background = "rgba(255, 152, 0, 0.85)";
        }
      };

      // 監聽音訊自然播放結束
      audioList.forEach(audio => {
        audio.addEventListener("ended", () => {
          playPauseBtn.innerText = "▶ 播放";
          playPauseBtn.style.backgroundColor = "#007bff";
          statusMsg.innerText = `播放完畢：${currentTitle}（按「結束」繼續掃描）`;
          statusMsg.style.background = "rgba(0, 123, 255, 0.85)";
        });
      });

      // 1. 使用者點擊授權：解鎖所有語音檔
      startBtn.addEventListener("click", () => {
        startOverlay.style.display = "none";
        
        const unlockPromises = audioList.map(audio => {
          audio.muted = true;
          return audio.play().then(() => {
            audio.pause();
            audio.currentTime = 0;
            audio.muted = false;
          }).catch(err => {
            audio.muted = false;
            console.warn("語音授權失敗:", err);
          });
        });

        Promise.all(unlockPromises).then(() => {
          console.log("所有語音檔已解除自動播放限制");
        });
      });

      // 2. 播放 / 暫停按鈕
      playPauseBtn.addEventListener("click", () => {
        if (!currentAudio) return;

        if (currentAudio.paused) {
          currentAudio.play();
          updateUIState(true);
        } else {
          currentAudio.pause();
          updateUIState(false);
        }
      });

      // 3. 重新播放按鈕
      replayBtn.addEventListener("click", () => {
        if (!currentAudio) return;

        currentAudio.currentTime = 0;
        currentAudio.play();
        updateUIState(true);
      });

      // 4. 結束按鈕：停止語音、關閉文字卡片、恢復掃描 UI 並執行 arSystem.unpause()
      closeBtn.addEventListener("click", () => {
        stopAllAudio();
        currentAudio = null;
        currentTitle = "";
        
        hideInfoCard();
        controlBar.style.display = "none";
        statusMsg.innerText = "請將鏡頭對準任意景點解說牌...";
        statusMsg.style.background = "rgba(0, 0, 0, 0.75)";

        isScanning = true;
        toggleMindAROverlay(true);

        const system = getArSystem();
        if (system) {
          system.unpause();
        }
      });

      // 5. 綁定 AR 目標事件
      const targets = document.querySelectorAll(".ar-target");

      targets.forEach(target => {
        const targetIndex = parseInt(target.getAttribute("data-index"), 10);

        // 辨識成功：隱藏 MindAR 掃描框、顯示文字卡片、播放語音並暫停掃描
        target.addEventListener("targetFound", () => {
          if (!isScanning) return;

          const targetAudio = audioList[targetIndex];
          const data = spotData[targetIndex];

          if (targetAudio && data) {
            isScanning = false;

            // 1. 隱藏 MindAR 內建的掃描遮罩
            toggleMindAROverlay(false);

            // 2. 顯示中央文字卡片與下方控制列
            showInfoCard(targetIndex);
            controlBar.style.display = "flex";

            // 3. 播放語音並更新狀態列
            stopAllAudio();
            currentAudio = targetAudio;
            currentTitle = `解說牌：${data.title}`;

            currentAudio.muted = false;
            currentAudio.play();
            updateUIState(true);

            // 4. 暫停 AR 鏡頭追蹤
            const system = getArSystem();
            if (system) {
              system.pause(true);
            }
          }
        });
      });
    });
  </script>
</body>
</html>
